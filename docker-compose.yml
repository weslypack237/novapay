# Local development only. Production uses managed Postgres/Redis and a secret manager.
name: novapay

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: novapay
      POSTGRES_USER: novapay
      POSTGRES_PASSWORD: ${DB_PASSWORD:-novapay_local_only}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novapay -d novapay"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build: { context: ., dockerfile: infrastructure/docker/api.Dockerfile }
    environment:
      DB_HOST: postgres
      DB_PASSWORD: ${DB_PASSWORD:-novapay_local_only}
      REDIS_HOST: redis
      NOVAPAY_DEMO_MODE: "true"
    volumes:
      - ./backend:/var/www/backend
      - ./scripts:/var/www/scripts:ro
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  queue:
    build: { context: ., dockerfile: infrastructure/docker/api.Dockerfile }
    command: ["sh", "-c", "sleep 20 && php artisan queue:work --tries=3"]
    environment:
      DB_HOST: postgres
      DB_PASSWORD: ${DB_PASSWORD:-novapay_local_only}
      REDIS_HOST: redis
    volumes: [./backend:/var/www/backend]
    depends_on: [api]

  web:
    build: { context: ., dockerfile: infrastructure/docker/web.Dockerfile }
    environment:
      NOVAPAY_API_URL: http://api:8000/api/v1
      NOVAPAY_DEMO_MODE: "true"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
